name: Bug Report
description: Create a report to help us fix a bug or unexpected behavior
title: '[Bug]: '
labels: ['bug']
assignees: ''
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Client / Frontend (React, Vite, UI)
        - Server / Backend (Express, REST API)
        - Database (MongoDB, Mongoose schemas)
        - Auth (Firebase, Dev Admin)
        - Tooling / CI / Setup
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser (if frontend), etc.
      placeholder: |
        - OS: Windows 11 / macOS / Ubuntu
        - Node version: v20.x
        - Browser: Chrome 120 / Firefox / Edge
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add screenshots or stack traces to help explain your problem.
    validations:
      required: false
